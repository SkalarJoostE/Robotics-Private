<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robotics-AI web app architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap">
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; }
  .t-title   { font: 700 30px "Bitter", Georgia, serif; fill: #1b355d; }
  .t-sub     { font: 400 16px "Nunito Sans", "Segoe UI", sans-serif; fill: #47597a; }
  .t-zone    { font: 800 12.5px "Nunito Sans", "Segoe UI", sans-serif; fill: #47597a; letter-spacing: 1.6px; }
  .t-h       { font: 800 15px "Nunito Sans", "Segoe UI", sans-serif; fill: #16233a; }
  .t-h-w     { font: 800 15px "Nunito Sans", "Segoe UI", sans-serif; fill: #ffffff; }
  .t-b       { font: 400 13.5px "Nunito Sans", "Segoe UI", sans-serif; fill: #33425c; }
  .t-b-w     { font: 400 13px "Nunito Sans", "Segoe UI", sans-serif; fill: #dbe4f3; }
  .t-lane    { font: 700 17px "Bitter", Georgia, serif; }
  .t-lbl     { font: 700 12px "Nunito Sans", "Segoe UI", sans-serif; fill: #47597a; }
  .t-card-h  { font: 700 16px "Bitter", Georgia, serif; fill: #1b355d; }
  .box       { fill: #ffffff; stroke: #c3d1ec; stroke-width: 1.5; }
  .arrow     { stroke: #1b355d; stroke-width: 2; fill: none; }
  .arrow-o   { stroke: #ffa400; stroke-width: 2.5; fill: none; }
</style>
</head>
<body>
<svg width="1720" height="1040" viewBox="0 0 1720 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b355d"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffa400"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="30" y="34" width="6" height="44" fill="#ffa400"/>
  <text x="50" y="62" class="t-title">Robotics-AI web app</text>
  <text x="50" y="86" class="t-sub">Architecture overview · proposal, November 2026</text>

  <!-- ZONE: People -->
  <rect x="20" y="110" width="240" height="760" rx="14" fill="#f6f8fb" stroke="#e1e7f1"/>
  <text x="40" y="140" class="t-zone">PEOPLE</text>

  <rect x="40" y="195" width="200" height="90" rx="10" fill="#1b355d"/>
  <text x="58" y="225" class="t-h-w">Skalar colleague</text>
  <text x="58" y="248" class="t-b-w">Browser on a laptop or</text>
  <text x="58" y="266" class="t-b-w">phone, from anywhere</text>

  <rect x="40" y="315" width="200" height="150" rx="10" class="box"/>
  <text x="58" y="343" class="t-h">Roles</text>
  <text x="58" y="368" class="t-b"><tspan font-weight="800">General</tspan> · knowledge</text>
  <text x="58" y="390" class="t-b"><tspan font-weight="800">Support</tspan> · + orders and logs</text>
  <text x="58" y="412" class="t-b"><tspan font-weight="800">Engineering</tspan> · + feasibility</text>
  <text x="58" y="434" class="t-b"><tspan font-weight="800">Admin</tspan> · + all chats, budgets</text>
  <text x="58" y="454" class="t-lbl">Personal monthly budget each</text>

  <!-- ZONE: Microsoft cloud -->
  <rect x="280" y="110" width="250" height="760" rx="14" fill="#f6f8fb" stroke="#c3d1ec" stroke-dasharray="6 4"/>
  <text x="300" y="140" class="t-zone">MICROSOFT CLOUD</text>

  <rect x="295" y="195" width="220" height="90" rx="10" class="box"/>
  <text x="312" y="225" class="t-h">Entra application proxy</text>
  <text x="312" y="248" class="t-b">Lets people in from outside</text>
  <text x="312" y="266" class="t-b">without opening the firewall</text>

  <rect x="295" y="335" width="220" height="90" rx="10" class="box"/>
  <text x="312" y="365" class="t-h">Entra ID login</text>
  <text x="312" y="388" class="t-b">Skalar work account (SSO)</text>
  <text x="312" y="406" class="t-b">Who you are and your role</text>

  <!-- ZONE: Skalar network -->
  <rect x="550" y="110" width="870" height="760" rx="14" fill="#eef2f9" stroke="#1b355d" stroke-width="1.5"/>
  <text x="570" y="140" class="t-zone">SKALAR NETWORK</text>

  <!-- VM -->
  <rect x="580" y="160" width="640" height="690" rx="12" fill="#ffffff" stroke="#9fb3d6" stroke-width="1.5"/>
  <text x="600" y="184" class="t-zone">WINDOWS SERVER (VIRTUAL MACHINE)</text>

  <!-- Web app -->
  <rect x="600" y="198" width="280" height="88" rx="10" fill="#f1f4f9" stroke="#c3d1ec" stroke-width="1.5"/>
  <text x="617" y="227" class="t-h">Web page (React)</text>
  <text x="617" y="250" class="t-b">Dashboard · chat · log upload</text>
  <text x="617" y="268" class="t-b">Live progress · Velaris look</text>

  <rect x="920" y="198" width="280" height="88" rx="10" fill="#f1f4f9" stroke="#c3d1ec" stroke-width="1.5"/>
  <text x="937" y="227" class="t-h">Back end (Python, FastAPI)</text>
  <text x="937" y="250" class="t-b">Login and role check · budgets</text>
  <text x="937" y="268" class="t-b">Conversations · sharing</text>

  <!-- Router -->
  <rect x="600" y="312" width="600" height="62" rx="10" fill="#1b355d"/>
  <text x="617" y="338" class="t-h-w">Router</text>
  <text x="617" y="360" class="t-b-w">Order number or log → order lane · anything else → knowledge lane</text>

  <!-- Knowledge lane -->
  <rect x="600" y="400" width="280" height="310" rx="12" fill="#e3f3ea" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="617" y="427" class="t-lane" fill="#1f7a4d">Knowledge lane (RAG)</text>
  <text x="617" y="446" class="t-lbl">General questions · seconds · cents</text>

  <rect x="615" y="460" width="250" height="92" rx="9" class="box"/>
  <text x="631" y="485" class="t-h">Search index</text>
  <text x="631" y="507" class="t-b">Knowledge base · case base</text>
  <text x="631" y="525" class="t-b">Known issues · order index cards</text>
  <text x="631" y="543" class="t-b">By keywords and by meaning</text>

  <rect x="615" y="572" width="250" height="122" rx="9" class="box"/>
  <text x="631" y="597" class="t-h">Answer with sources</text>
  <text x="631" y="619" class="t-b">One call to Claude Sonnet</text>
  <text x="631" y="637" class="t-b">Cites the pages it used</text>
  <text x="631" y="655" class="t-b">Shows draft / verified status</text>
  <text x="631" y="673" class="t-b">Says so when nothing fits</text>

  <!-- Order lane -->
  <rect x="920" y="400" width="280" height="310" rx="12" fill="#e6ecf7" stroke="#1b355d" stroke-width="1.5"/>
  <text x="937" y="427" class="t-lane" fill="#1b355d">Order lane</text>
  <text x="937" y="446" class="t-lbl">Orders and logs · minutes · euros</text>

  <rect x="935" y="460" width="250" height="56" rx="9" class="box"/>
  <text x="951" y="484" class="t-h">Job queue</text>
  <text x="951" y="505" class="t-b">One question per order at a time</text>

  <rect x="935" y="532" width="250" height="84" rx="9" class="box"/>
  <text x="951" y="556" class="t-h">Agent worker (Claude Opus)</text>
  <text x="951" y="578" class="t-b">Robotics-AI skills and scripts</text>
  <text x="951" y="596" class="t-b">Log reader · read-only</text>

  <rect x="935" y="640" width="250" height="58" rx="9" class="box"/>
  <text x="951" y="663" class="t-h">Workspace copy</text>
  <text x="951" y="684" class="t-b">Release branch · order checkouts</text>

  <!-- Bottom row in VM -->
  <rect x="600" y="736" width="280" height="92" rx="10" fill="#f1f4f9" stroke="#c3d1ec" stroke-width="1.5"/>
  <text x="617" y="764" class="t-h">Database (SQLite)</text>
  <text x="617" y="787" class="t-b">Users · budgets · conversations</text>
  <text x="617" y="805" class="t-b">Cost of every AI call · feedback</text>

  <rect x="920" y="736" width="280" height="92" rx="10" fill="#f1f4f9" stroke="#c3d1ec" stroke-width="1.5"/>
  <text x="937" y="764" class="t-h">Scheduled sync</text>
  <text x="937" y="787" class="t-b">Pulls the release branch</text>
  <text x="937" y="805" class="t-b">Rebuilds the RAG search index</text>

  <!-- SVN inside network -->
  <rect x="1245" y="532" width="160" height="84" rx="10" class="box"/>
  <text x="1261" y="556" class="t-h">SVN server</text>
  <text x="1261" y="578" class="t-b">Order software</text>
  <text x="1261" y="596" class="t-b">Read-only account</text>

  <!-- ZONE: external -->
  <rect x="1440" y="110" width="260" height="760" rx="14" fill="#f6f8fb" stroke="#c3d1ec" stroke-dasharray="6 4"/>
  <text x="1460" y="140" class="t-zone">EXTERNAL SERVICES</text>

  <rect x="1455" y="380" width="230" height="120" rx="10" fill="#1b355d"/>
  <text x="1472" y="410" class="t-h-w">Anthropic API</text>
  <text x="1472" y="433" class="t-b-w">Claude Opus · Sonnet · Haiku</text>
  <text x="1472" y="451" class="t-b-w">Skalar company account</text>
  <text x="1472" y="469" class="t-b-w">Monthly spend limit</text>

  <rect x="1455" y="736" width="230" height="92" rx="10" class="box"/>
  <text x="1472" y="764" class="t-h">Git hosting</text>
  <text x="1472" y="787" class="t-b">Web app code (Bitbucket)</text>
  <text x="1472" y="805" class="t-b">Robotics-AI workspace</text>

  <!-- Arrows -->
  <path class="arrow" d="M240,241 H291" marker-end="url(#ah)"/>
  <text x="248" y="232" class="t-lbl">HTTPS</text>

  <path class="arrow" d="M405,289 V331" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="414" y="315" class="t-lbl">sign in</text>

  <path class="arrow" d="M515,241 H596" marker-end="url(#ah)"/>

  <path class="arrow" d="M884,242 H916" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <path class="arrow" d="M1060,286 V308" marker-end="url(#ah)"/>
  <path class="arrow" d="M740,374 V396" marker-end="url(#ah)"/>
  <path class="arrow" d="M1060,374 V396" marker-end="url(#ah)"/>

  <path class="arrow" d="M740,552 V568" marker-end="url(#ah)"/>
  <path class="arrow" d="M1060,516 V528" marker-end="url(#ah)"/>
  <path class="arrow" d="M1060,619 V636" marker-end="url(#ah)"/>


  <path class="arrow" d="M1185,574 H1241" marker-end="url(#ah)"/>

  <path class="arrow" d="M1200,343 H1300 V440 H1451" marker-end="url(#ah)"/>
  <text x="1312" y="416" class="t-lbl">All AI calls,</text>
  <text x="1312" y="432" class="t-lbl">outgoing HTTPS</text>

  <path class="arrow" d="M1200,782 H1451" marker-end="url(#ah)"/>
  <text x="1262" y="772" class="t-lbl">pulls code + workspace</text>

  <!-- Guarantees -->
  <rect x="20" y="895" width="545" height="118" rx="12" fill="#fff8ea" stroke="#ffcf70"/>
  <text x="40" y="926" class="t-card-h">Read-only by construction</text>
  <text x="40" y="952" class="t-b">Never commits to SVN, never writes to Jira, never changes</text>
  <text x="40" y="972" class="t-b">order software. Enforced by the server’s tool list and</text>
  <text x="40" y="992" class="t-b">accounts, not only by instructions.</text>

  <rect x="587" y="895" width="545" height="118" rx="12" fill="#fff8ea" stroke="#ffcf70"/>
  <text x="607" y="926" class="t-card-h">Budgets per person and company-wide</text>
  <text x="607" y="952" class="t-b">Every AI call is recorded with its cost. Budgets are checked</text>
  <text x="607" y="972" class="t-b">before each question; an answer that has started always</text>
  <text x="607" y="992" class="t-b">finishes. Users can request more.</text>

  <rect x="1155" y="895" width="545" height="118" rx="12" fill="#fff8ea" stroke="#ffcf70"/>
  <text x="1175" y="926" class="t-card-h">Nothing exposed to the internet</text>
  <text x="1175" y="952" class="t-b">The server only makes outgoing connections. People reach it</text>
  <text x="1175" y="972" class="t-b">through Microsoft’s login, from the office or a customer site,</text>
  <text x="1175" y="992" class="t-b">without VPN.</text>
</svg>
</body>
</html>
